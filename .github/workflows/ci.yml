name: Continuous integration

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev --group docs
      - name: Lint Python for errors
        run: uv run ruff check --select E9,F63,F7,F82 src/eu_electricity_forecast tests
      - name: Unit tests
        run: uv run pytest -q tests/test_training.py tests/test_entsoe_client.py tests/test_entsoe_ingestion_unit.py tests/test_silver.py tests/test_provenance.py tests/test_catalog_policy.py tests/test_provision_catalog.py
      - name: Build documentation
        run: make docs-build
      - name: Build wheel
        run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error

  code-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
