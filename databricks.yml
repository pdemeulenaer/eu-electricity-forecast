# This is a Declarative Automation Bundle definition for eu-electricity-forecast.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: eu-electricity-forecast
  uuid: 755f5b3d-e83f-47f4-b9ad-a91748609260

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b0577817-50e1.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-b0577817-50e1.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pdemeulenaer@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pdemeulenaer@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: pdemeulenaer@gmail.com
        level: CAN_MANAGE
