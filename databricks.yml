# This is a Declarative Automation Bundle definition for eu-electricity-forecast.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: eu-electricity-forecast
  engine: direct
  uuid: 755f5b3d-e83f-47f4-b9ad-a91748609260

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned per target below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: Schema for the generated starter resources
  project_catalog:
    description: Unity Catalog catalog for ENTSO-E forecasting data
  dev_user:
    description: Developer identity allowed to read production data
    default: pdemeulenaer@gmail.com
  qa_principal:
    description: QA service principal application ID
    default: e6d071ea-8492-46d9-9fe2-d62acb170e5a
  prod_principal:
    description: Production service principal application ID
    default: f9672800-44a3-4c53-a1ef-9c26fd3154df
  production_catalog:
    description: Production Unity Catalog catalog; read-only to dev and QA jobs
    default: eu_electricity_forecast_prod
  landing_schema:
    description: Schema that owns the ENTSO-E landing volume
  bronze_schema:
    description: Schema for append-only ENTSO-E observations
  silver_schema:
    description: Schema for typed ENTSO-E observations
  gold_schema:
    description: Schema for day-ahead features and downstream model outputs
  entsoe_secret_scope:
    description: Databricks secret scope containing the ENTSO-E token
  entsoe_secret_key:
    description: Key name for the ENTSO-E token secret

experimental:
  skip_name_prefix_for_schema: true

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: ""
    workspace:
      host: https://dbc-b0577817-50e1.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
      project_catalog: eu_electricity_forecast
      landing_schema: landing
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      entsoe_secret_scope: entsoe
      entsoe_secret_key: api-token
  qa:
    mode: production
    presets:
      name_prefix: "[qa] "
    workspace:
      host: https://dbc-b0577817-50e1.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: qa
      project_catalog: eu_electricity_forecast_qa
      landing_schema: landing
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      entsoe_secret_scope: entsoe
      entsoe_secret_key: api-token
    resources:
      jobs:
        entsoe_ingestion:
          run_as:
            service_principal_name: ${var.qa_principal}
          trigger:
            pause_status: PAUSED
        entsoe_historical_backfill:
          run_as:
            service_principal_name: ${var.qa_principal}
        day_ahead_training:
          run_as:
            service_principal_name: ${var.qa_principal}
  prod:
    mode: production
    workspace:
      host: https://dbc-b0577817-50e1.cloud.databricks.com
      # Deploy using the production service principal so this path and ownership are stable.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
      project_catalog: ${var.production_catalog}
      landing_schema: landing
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
      entsoe_secret_scope: entsoe
      entsoe_secret_key: api-token
    permissions:
      - user_name: pdemeulenaer@gmail.com
        level: CAN_MANAGE
      - service_principal_name: ${var.prod_principal}
        level: CAN_MANAGE
    resources:
      jobs:
        entsoe_ingestion:
          run_as:
            service_principal_name: ${var.prod_principal}
          trigger:
            pause_status: UNPAUSED
        entsoe_historical_backfill:
          run_as:
            service_principal_name: ${var.prod_principal}
        day_ahead_training:
          run_as:
            service_principal_name: ${var.prod_principal}
