resources:
  jobs:
    entsoe_ingestion:
      name: eu-electricity-forecast-entsoe-ingestion
      tags:
        aidevkit_project: ai-dev-kit
      performance_target: STANDARD
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: HOURS
      max_concurrent_runs: 1
      tasks:
        - task_key: poll_entsoe
          python_wheel_task:
            package_name: eu_electricity_forecast
            entry_point: entsoe-ingest
            parameters:
              - --mode
              - poll
              - --overlap-hours
              - "6"
              - --landing-dir
              - /Volumes/${var.project_catalog}/${var.landing_schema}/entsoe_landing
              - --secret-scope
              - ${var.entsoe_secret_scope}
              - --secret-key
              - ${var.entsoe_secret_key}
          environment_key: default
          max_retries: 2
        - task_key: bronze_autoloader
          depends_on:
            - task_key: poll_entsoe
          run_if: ALL_DONE
          python_wheel_task:
            package_name: eu_electricity_forecast
            entry_point: entsoe-autoload
            parameters:
              - --landing-dir
              - /Volumes/${var.project_catalog}/${var.landing_schema}/entsoe_landing
              - --catalog
              - ${var.project_catalog}
              - --schema
              - ${var.bronze_schema}
          environment_key: default
          max_retries: 2
        - task_key: silver_normalize
          depends_on:
            - task_key: bronze_autoloader
          python_wheel_task:
            package_name: eu_electricity_forecast
            entry_point: entsoe-silver
            parameters:
              - --catalog
              - ${var.project_catalog}
              - --bronze-schema
              - ${var.bronze_schema}
              - --silver-schema
              - ${var.silver_schema}
          environment_key: default
          max_retries: 2
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - requests==2.34.2
              - ../dist/*.whl
