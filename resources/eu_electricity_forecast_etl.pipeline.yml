# The main pipeline for eu_electricity_forecast

resources:
  pipelines:
    eu_electricity_forecast_etl:
      name: eu-electricity-forecast-etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/eu_electricity_forecast_etl"

      libraries:
        - glob:
            include: ../src/eu_electricity_forecast_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
