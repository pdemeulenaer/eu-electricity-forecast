# Run manually to apply catalog-level access grants.
targets:
  qa:
    resources:
      jobs:
        provision_catalog:
          name: ${bundle.name}-provision-catalog
          performance_target: STANDARD
          tasks:
            - task_key: create_catalog
              notebook_task:
                notebook_path: ../src/notebooks/provision_catalog.py
                base_parameters:
                  catalog: ${var.project_catalog}
                  writer: ${var.qa_principal}
                  readers_json: '["${var.dev_user}"]'
  prod:
    resources:
      jobs:
        provision_catalog:
          name: ${bundle.name}-provision-catalog
          performance_target: STANDARD
          tasks:
            - task_key: create_catalog
              notebook_task:
                notebook_path: ../src/notebooks/provision_catalog.py
                base_parameters:
                  catalog: ${var.project_catalog}
                  writer: ${var.prod_principal}
                  readers_json: '["${var.dev_user}", "${var.qa_principal}"]'
